name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # The framing is portable Object Pascal, so it is tested on Linux where the
  # toolchain is free — this is the bulk of the logic and where a parsing or
  # length bug would live.
  core:
    name: Framing (Free Pascal, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV
      - name: Build and run framing tests
        run: |
          mkdir -p build
          fpc -Mdelphi -Fusrc -Futests -FUbuild -obuild/CoreTests tests/CoreTests.dpr
          ./build/CoreTests

  # The WM_COPYDATA transport is Windows-only, so it is built and run on a
  # Windows runner. This job also compiles the demo, so a broken demo fails CI.
  transport:
    name: Transport (Free Pascal, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # setup-lazarus installs FPC and puts it on PATH for every later step,
      # which the choco + Update-SessionEnvironment route did not do reliably.
      - name: Install Free Pascal
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable
      - name: Show compiler version
        shell: bash
        run: fpc -iV
      # bash (git-bash on the Windows runner) makes ./build/WinTests.exe and
      # forward-slash paths behave, and fails the step on a non-zero exit.
      - name: Build and run full suite (framing + transport)
        shell: bash
        run: |
          mkdir -p build
          fpc -Mdelphi -Fusrc -Futests -FUbuild -obuild/WinTests tests/WinTests.dpr
          ./build/WinTests.exe
      - name: Build the demo
        shell: bash
        run: fpc -Mdelphi -Fusrc -FUbuild -obuild/Demo demo/Demo.dpr
